<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="RockStar">
  <!-- RockStar wordmark: Rock in primary text, Star in sky. -->
  <text x="6" y="32" dominant-baseline="central"
        font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-weight="800" font-size="40" letter-spacing="-1.5">
    <tspan fill="#f8fafc">Rock</tspan><tspan fill="#0ea5e9">Star</tspan>
  </text>
</svg>
